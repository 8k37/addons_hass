name: lint

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: py_compile
        run: |
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m py_compile
          echo "OK: all Python files compiled"

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate addon YAML
        run: |
          python3 - <<'EOF'
          import glob, yaml, sys
          files = (glob.glob('*/config.yaml') + glob.glob('*/build.yaml')
                   + ['repository.yaml'])
          ok = True
          for f in files:
              try:
                  data = yaml.safe_load(open(f))
                  assert isinstance(data, dict), 'not a mapping'
                  print(f'{f}: OK')
              except Exception as e:
                  ok = False
                  print(f'{f}: FAIL {e}')
          sys.exit(0 if ok else 1)
          EOF
