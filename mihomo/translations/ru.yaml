configuration:
  dns_hijack:
    name: Перехват DNS
    description: Заворачивать DNS-запросы (порт 53) устройств на mihomo. Выключите, если используете свой DNS (AdGuard, Pi-hole) на роутере.
  stall_watchdog:
    name: Сторож простоя
    description: Следить за входящим трафиком. Если при активных подключениях закачка остановилась (или ниже планки) — тестировать узлы и переключаться на быстрый.
  stall_timeout_sec:
    name: Порог простоя (секунд)
    description: Сколько секунд подряд входящая скорость должна быть ниже планки, чтобы сторож запустил проверку узлов.
  stall_floor_kbps:
    name: Планка скорости простоя (КБ/с)
    description: Входящая скорость ниже этого значения считается простоем. 0 — считать простоем только полную остановку трафика.
  stall_min_speed_kbps:
    name: Достаточная скорость узла (КБ/с)
    description: Первый узел, выдавший при тесте такую скорость, выбирается сразу без проверки остальных. 0 — всегда искать самый быстрый.
  stall_test_timeout_sec:
    name: Таймаут теста одного узла (секунд)
    description: Максимум секунд на замер скорости одного узла.
  stall_early_sample_sec:
    name: Интервал досрочного прогноза (секунд)
    description: Раз в этот интервал оценивается скорость по уже скачанному. Если прогноз уже выше порога — тест узла прекращается досрочно. 0 — выключить прогноз.
  speedtest_url:
    name: URL файла для замера скорости
    description: Файл, который скачивается через узел при тесте скорости. Рекомендуется 2–10 МБ.
  config_file:
    name: Путь к конфигу mihomo
    description: Файл конфигурации ядра (обычно менять не нужно).
  mode:
    name: Режим маршрутизации
    description: rule — по правилам конфига, global — всё через прокси, direct — ничего не проксировать.
  gateway_mode:
    name: Режим шлюза
    description: Перенаправлять трафик устройств сети через mihomo (iptables). Требует указать аддон шлюзом в настройках сети.
  subscriptions:
    name: Подписки
    description: Список URL подписок с прокси-узлами.
  vpns:
    name: VPN-конфиги
    description: Пути к файлам VPN-конфигураций.
  healthcheck_url:
    name: URL проверки живости
    description: Адрес для health-check узлов (url-test, группа AUTO).
network:
  7890/tcp:
    name: Порт прокси (HTTP/SOCKS5)
    description: Mixed-порт для прокси-клиентов.
  7891/tcp:
    name: Порт SOCKS5
    description: Отдельный SOCKS5-порт.
  9090/tcp:
    name: Панель управления (API)
    description: Внешний контроллер и веб-интерфейс.
