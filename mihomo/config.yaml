# Home Assistant Add-on: Mihomo (Clash Meta)
name: Mihomo
version: "1.10.8"
slug: mihomo
description: Mihomo (Clash Meta) proxy core — HTTP/SOCKS5 прокси и внешняя панель управления
url: https://github.com/MetaCubeX/mihomo
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
init: false
startup: services
boot: auto
host_network: true
privileged:
  - NET_ADMIN
hassio_api: false
homeassistant_api: false
map:
  - share:rw
ports:
  7890/tcp: 7890
  7891/tcp: 7891
  9090/tcp: 9090
ports_description:
  7890/tcp: HTTP/SOCKS5 (mixed) proxy port
  7891/tcp: SOCKS5 proxy port
  9090/tcp: External controller (API / Web UI)
webui: "http://[HOST]:[PORT:9090]/ui/"
ingress: true
ingress_port: 9090
ingress_entry: "ui/"
panel_icon: mdi:shield-lock-outline
panel_title: Mihomo
panel_admin: true
options:
  dns_hijack: true
  enabled: true
  config_file: /share/mihomo/config.yaml
  mode: rule
  gateway_mode: false
  subscriptions: []
  vpns: []
  healthcheck_url: https://www.gstatic.com/generate_204
schema:
  dns_hijack: bool
  enabled: bool
  config_file: str
  mode: "list(global|rule|direct)"
  gateway_mode: bool
  subscriptions:
    - str
  vpns:
    - str
  healthcheck_url: str
